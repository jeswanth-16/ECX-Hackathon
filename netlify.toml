# Netlify Production Configuration for EDGECRAFT 2026
# Vite + React (SPA Frontend)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA client-side routing fallback
# Ensures routes such as /my-team, /admin/dashboard, and /team/:id resolve without 404 on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
